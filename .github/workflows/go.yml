name: Test and deploy

on: push


jobs:
  
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      
      - name: setup go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.26.1

      - name: build
        run: go build -v ./...
  
  test:
    name: test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.26.1

      - name: test
        run: go test -v ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set up go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.26.1

      - name: lint
        run: go vet -v ./...

  deploy:
    name: Push image to Hub
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    if: startsWith(github.ref, 'refs/tags')
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set up docker
        uses: docker/setup-buildx-action@v4

      - name: login to docker
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/package_parcel

      - name: build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
